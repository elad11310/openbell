<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenBell</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f3ef; --surface: #fcfcfb; --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --series: #2a78d6;
    --good: #0ca30c; --critical: #d03b3b; --warning: #fab219;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #111110; --surface: #1a1a19; --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --series: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--text-2); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; min-width: 0; }
  .status { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--text-2); font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--good); } .dot.warn { background: var(--warning); } .dot.off { background: var(--critical); }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 720px) { .tiles { grid-template-columns: repeat(4, 1fr); } .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } }
  .two { display: grid; gap: 12px; }
  .tile .label { color: var(--text-2); font-size: 12px; }
  .tile .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .tile .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .delta { display: inline-flex; align-items: center; gap: 4px; }
  .delta i { font-style: normal; font-size: 11px; }
  .up i { color: var(--good); } .down i { color: var(--critical); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 10px 6px 0; white-space: nowrap; }
  td { padding: 6px 10px 6px 0; border-top: 1px solid var(--grid); white-space: nowrap; }
  td.num, th.num { text-align: right; padding-right: 0; padding-left: 10px; }
  td.wrap, th.wrap { white-space: normal; min-width: 220px; padding-left: 16px; }
  td.wrap { color: var(--text-2); }
  .empty { color: var(--muted); padding: 6px 0; }
  .tag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-2); }
  #chart { position: relative; }
  #chart svg { display: block; width: 100%; height: 200px; }
  #tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
         border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap; display: none; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 12px; margin: -4px 0 8px; }
  .verdict { display: inline-flex; align-items: center; gap: 5px; }
  .verdict i { font-style: normal; font-weight: 700; }
  .verdict.ok i { color: var(--good); } .verdict.no i { color: var(--critical); } .verdict.skip i { color: var(--muted); }
  .plan p, .review p { margin: 0 0 6px; color: var(--text-2); white-space: pre-wrap; }
  .banner { border-left: 3px solid var(--warning); }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 4px 0 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>OpenBell <span class="tag">PAPER</span></h1>
    <div class="status" id="status"></div>
  </header>
  <div class="card banner" id="banner" hidden></div>
  <section class="tiles" id="tiles"></section>
  <section class="card">
    <h2>Account equity</h2>
    <div id="chart"><svg id="svg" role="img" aria-label="Account equity over time"></svg><div id="tip"></div></div>
  </section>
  <section class="card"><h2>Open positions</h2><div class="scroll" id="positions"></div></section>
  <section class="card"><h2>Watchlist</h2><div class="scroll" id="watch"></div></section>
  <section class="card"><h2 id="scanTitle">Today's scan</h2><div class="sub" id="scanNote"></div><div class="scroll" id="scan"></div></section>
  <div class="two">
    <section class="card plan"><h2>Today's plan</h2><div id="plan"></div></section>
    <section class="card"><h2>Results by strategy</h2><div class="scroll" id="stats"></div></section>
  </div>
  <section class="card"><h2>Recent trades</h2><div class="scroll" id="trades"></div></section>
  <section class="card"><h2>Activity</h2><div class="scroll" id="events"></div></section>
  <section class="card review" id="reviewCard" hidden><h2 id="reviewTitle">Review</h2><div id="review"></div></section>
  <footer>Simulated fills on live prices. No real orders are sent.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (v, d = 2) => v == null ? "–" : v.toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const signed = (v, d = 2, unit = "") => {
  if (v == null) return "–";
  const cls = v > 0 ? "up" : v < 0 ? "down" : "";
  const arrow = v > 0 ? "▲" : v < 0 ? "▼" : "";
  return `<span class="delta ${cls}"><i>${arrow}</i>${v > 0 ? "+" : v < 0 ? "−" : ""}${money(Math.abs(v), d)}${unit}</span>`;
};
let TZ = "UTC";
const clock = (iso, tz, opt) => new Date(iso).toLocaleString("en-GB", Object.assign({timeZone: tz, hour: "2-digit", minute: "2-digit"}, opt || {}));
const stamp = iso => clock(iso, "America/New_York", {day: "2-digit", month: "short"});

function table(el, cols, rows, emptyText) {
  if (!rows.length) { el.innerHTML = `<div class="empty">${emptyText}</div>`; return; }
  el.innerHTML = "<table><thead><tr>" + cols.map(c => `<th class="${c.cls || ""}">${c.h}</th>`).join("") +
    "</tr></thead><tbody>" + rows.map(r => "<tr>" + cols.map(c => `<td class="${c.cls || ""}">${c.f(r)}</td>`).join("") + "</tr>").join("") +
    "</tbody></table>";
}

function countdown(ms) {
  const m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return d ? `${d}d ${h % 24}h` : h ? `${h}h ${m % 60}m` : `${m}m`;
}

let curve = [], curveSig = "";
function drawChart() {
  const svg = $("svg"), W = svg.clientWidth || 600, H = 200, L = 8, R = 56, T = 10, B = 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (curve.length < 2) { svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--muted)" font-size="13">No equity history yet</text>`; return; }
  const ys = curve.map(p => p.equity); let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = (hi - lo || hi * 0.01) * 0.12; lo -= pad; hi += pad;
  const x = i => L + i * (W - L - R) / (curve.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  let g = "";
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * k / 3;
    g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>` +
         `<text x="${W-R+6}" y="${y(v)+4}" fill="var(--muted)" font-size="11">${money(v, 0)}</text>`;
  }
  [0, curve.length - 1].forEach((i, k) => g += `<text x="${x(i)}" y="${H-5}" text-anchor="${k ? "end" : "start"}" fill="var(--muted)" font-size="11">${stamp(curve[i].ts).split(",")[0]}</text>`);
  const d = curve.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.equity).toFixed(1)}`).join("");
  const last = curve.length - 1;
  svg.innerHTML = g + `<path d="${d}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${x(last)}" cy="${y(curve[last].equity)}" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/>` +
    `<g id="cross" style="display:none"><line id="cl" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1"/><circle id="cd" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/></g>`;
  const move = e => {
    const rect = svg.getBoundingClientRect(), px = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left);
    const i = Math.max(0, Math.min(last, Math.round((px - L) / (W - L - R) * last))), p = curve[i];
    $("cross").style.display = ""; $("cl").setAttribute("x1", x(i)); $("cl").setAttribute("x2", x(i));
    $("cd").setAttribute("cx", x(i)); $("cd").setAttribute("cy", y(p.equity));
    const tip = $("tip"); tip.style.display = "block";
    tip.innerHTML = `<b>${money(p.equity)}</b> · ${stamp(p.ts)} ET`;
    tip.style.left = Math.min(Math.max(x(i) - tip.offsetWidth / 2, 0), W - tip.offsetWidth) + "px";
  };
  const leave = () => { const c = $("cross"); if (c) c.style.display = "none"; $("tip").style.display = "none"; };
  svg.onmousemove = move; svg.ontouchstart = move; svg.ontouchmove = move; svg.onmouseleave = leave; svg.ontouchend = leave;
}

function render(s) {
  TZ = s.display_tz || "UTC";
  const now = new Date(s.now), sess = s.session, nx = s.next_session;
  const open = sess && now >= new Date(sess.open) && now < new Date(sess.close);
  let when = "";
  if (open) when = `closes in ${countdown(new Date(sess.close) - now)}${sess.early_close ? " (half day)" : ""}`;
  else if (nx && new Date(nx.open) > now) when = `opens in ${countdown(new Date(nx.open) - now)}${nx.early_close ? " (half day)" : ""}`;
  const dot = open ? (s.feed_ok && !s.halted ? "on" : "warn") : "";
  $("status").innerHTML =
    `<span class="pill"><span class="dot ${dot}"></span>${open ? "Market open" : "Market closed"}</span>` +
    `<span>${esc(s.status)}${when ? " · " + when : ""}</span>` +
    `<span>${clock(s.now, "America/New_York")} New York · ${clock(s.now, TZ)} local</span>` +
    `<span>Agent ${s.agent_active ? "on" : "off"}</span>`;
  const b = $("banner"), msgs = [];
  if (s.halted) msgs.push("Daily loss limit reached. No new entries today.");
  if (open && !s.feed_ok) msgs.push("Data feed is silent. Entries are blocked until it recovers.");
  b.hidden = !msgs.length; b.textContent = msgs.join(" ");

  const bench = (s.equity_curve || []).filter(p => p.benchmark);
  const benchRet = bench.length > 1 ? (bench[bench.length - 1].benchmark / bench[0].benchmark - 1) * 100 : null;
  const tiles = [
    ["Equity", money(s.equity), `cash ${money(s.cash, 0)}`],
    ["Day P&L", signed(s.day_pnl), signed(s.day_pnl_pct, 2, "%")],
    ["Total return", signed(s.total_pnl_pct, 2, "%"), benchRet == null ? `${esc(s.benchmark)} –` : `${esc(s.benchmark)} ${benchRet >= 0 ? "+" : "−"}${Math.abs(benchRet).toFixed(2)}% same period`],
    ["Exposure", `${money(s.exposure_pct, 1)}%`, `${s.positions.length} open · ${s.trades_today} entries today`],
  ];
  $("tiles").innerHTML = tiles.map(t => `<div class="card tile"><div class="label">${t[0]}</div><div class="value">${t[1]}</div><div class="sub">${t[2]}</div></div>`).join("");

  table($("positions"), [
    {h: "Symbol", f: r => `<b>${esc(r.symbol)}</b> <span class="tag">${esc(r.strategy)}</span>`},
    {h: "Qty", cls: "num", f: r => r.qty}, {h: "Entry", cls: "num", f: r => money(r.entry)},
    {h: "Last", cls: "num", f: r => money(r.last)}, {h: "Stop", cls: "num", f: r => money(r.stop)},
    {h: "Target", cls: "num", f: r => r.target ? money(r.target) : "trail"},
    {h: "P&L", cls: "num", f: r => signed(r.pnl)}, {h: "R", cls: "num", f: r => signed(r.r, 2)},
  ], s.positions, "No open positions.");

  table($("watch"), [
    {h: "Symbol", f: r => `<b>${esc(r.symbol)}</b>`}, {h: "Last", cls: "num", f: r => money(r.last)},
    {h: "Day", cls: "num", f: r => signed(r.chg_pct, 2, "%")}, {h: "VWAP", cls: "num", f: r => money(r.vwap)},
    {h: "Range high", cls: "num", f: r => money(r.or_high)}, {h: "Swing trigger", cls: "num", f: r => money(r.swing_trigger)},
    {h: "Agent note", cls: "wrap", f: r => esc(r.note)},
  ], s.watchlist, "No symbols.");

  const scan = s.scan || [], ss = s.scan_stats || {};
  $("scanTitle").textContent = scan.length ? `Scan · ${scan[0].day}` : "Today's scan";
  const fmt = v => v == null ? "–" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) + "%";
  $("scanNote").textContent = (ss.approve && ss.approve.n) ?
    `Next-day move so far: approved ${fmt(ss.approve.avg_1d)} (${ss.approve.n}), rejected ${fmt(ss.reject.avg_1d)} (${ss.reject.n})` :
    (scan.length ? `Selected by ${scan[0].source === "agent" ? "the agent" : "numeric rank (agent not used)"}` : "");
  const verdict = r => r.decision === "reject" ? `<span class="verdict no"><i>✕</i>Rejected</span>` :
    r.picked ? `<span class="verdict ok"><i>✓</i>Watching</span>` : `<span class="verdict skip"><i>–</i>No slot</span>`;
  table($("scan"), [
    {h: "#", f: r => r.rank}, {h: "Symbol", f: r => `<b>${esc(r.symbol)}</b> <span class="tag">${esc(r.kind)}</span>`},
    {h: "Result", f: verdict}, {h: "Gap", cls: "num", f: r => signed(r.metrics.gap_pct, 2, "%")},
    {h: "News", f: r => r.metrics.fresh_news ? "new" : "–"},
    {h: "Rel. volume", cls: "num", f: r => money(r.metrics.rvol) + "×"},
    {h: "3-month vs market", cls: "num", f: r => signed(r.metrics.rs_3m_pct, 1, "%")},
    {h: "Earnings", cls: "num", f: r => r.earnings_in_days == null ? "–" : `in ${r.earnings_in_days}d`},
    {h: "Reason / headline", cls: "wrap", f: r => esc(r.reason) + (r.headlines.length ? `<br><span style="color:var(--muted)">${esc(r.headlines[0])}</span>` : "")},
  ], scan, "No scan has run yet.");

  const p = s.plan || {};
  $("plan").innerHTML = `<p><b>${esc((p.regime || "").replace("_", " "))}</b> · risk ×${(p.risk_multiplier ?? 1).toFixed(2)} · source: ${esc(p.source)}</p><p>${esc(p.summary)}</p>`;

  table($("stats"), [
    {h: "Strategy", f: r => esc(r[0])}, {h: "Trades", cls: "num", f: r => r[1].trades},
    {h: "Win rate", cls: "num", f: r => r[1].trades ? r[1].win_rate + "%" : "–"},
    {h: "Avg R", cls: "num", f: r => r[1].trades ? signed(r[1].avg_r) : "–"},
    {h: "Profit factor", cls: "num", f: r => r[1].profit_factor ?? "–"},
    {h: "P&L", cls: "num", f: r => r[1].trades ? signed(r[1].pnl) : "–"},
  ], Object.entries(s.stats || {}).filter(e => e[1].trades), "No closed trades yet.");

  table($("trades"), [
    {h: "Exit (ET)", f: r => stamp(r.exit_ts)}, {h: "Symbol", f: r => `<b>${esc(r.symbol)}</b> <span class="tag">${esc(r.strategy)}</span>`},
    {h: "Qty", cls: "num", f: r => r.qty}, {h: "Entry", cls: "num", f: r => money(r.entry_px)},
    {h: "Exit", cls: "num", f: r => money(r.exit_px)}, {h: "P&L", cls: "num", f: r => signed(r.pnl)},
    {h: "R", cls: "num", f: r => signed(r.r_multiple)}, {h: "Reason", f: r => esc(r.exit_reason)},
  ], s.trades || [], "No closed trades yet.");

  table($("events"), [
    {h: "Time (ET)", f: r => stamp(r.ts)}, {h: "", f: r => `<span class="tag">${esc(r.kind)}</span>`},
    {h: "Symbol", f: r => esc(r.symbol)}, {h: "Detail", cls: "wrap", f: r => esc(r.message)},
  ], s.events || [], "Nothing yet.");

  $("reviewCard").hidden = !s.review;
  if (s.review) { $("reviewTitle").textContent = `Agent review · ${s.review_day}`; $("review").innerHTML = `<p>${esc(s.review)}</p>`; }
  const next = s.equity_curve || [], sig = next.length + ":" + (next.length ? next[next.length - 1].equity : 0);
  if (sig !== curveSig) { curveSig = sig; curve = next; drawChart(); }
}

async function tick() {
  try { render(await (await fetch("api/state")).json()); }
  catch (e) { $("status").innerHTML = `<span class="pill"><span class="dot off"></span>Engine not reachable</span>`; }
}
tick(); setInterval(tick, 3000); addEventListener("resize", drawChart);
</script>
</body>
</html>

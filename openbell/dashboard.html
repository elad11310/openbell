<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenBell</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f3ef; --surface: #fcfcfb; --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --series: #2a78d6;
    --good: #0ca30c; --critical: #d03b3b; --warning: #fab219;
    /* Price-chart lines, in the palette's fixed order blue, orange, aqua (checked for
       colour-blind separation in both themes). VWAP is also dashed, so it never relies
       on colour alone next to the green candles. */
    --ema-fast: #2a78d6; --ema-slow: #eb6834; --vwap: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #111110; --surface: #1a1a19; --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --series: #3987e5;
      --ema-fast: #3987e5; --ema-slow: #d95926; --vwap: #199e70;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--text-2); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; min-width: 0; }
  .status { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--text-2); font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--good); } .dot.warn { background: var(--warning); } .dot.off { background: var(--critical); }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 720px) { .tiles { grid-template-columns: repeat(4, 1fr); } .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } }
  .two { display: grid; gap: 12px; }
  .tile .label { color: var(--text-2); font-size: 12px; }
  .tile .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .tile .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .delta { display: inline-flex; align-items: center; gap: 4px; }
  .delta i { font-style: normal; font-size: 11px; }
  .up i { color: var(--good); } .down i { color: var(--critical); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 10px 6px 0; white-space: nowrap; }
  td { padding: 6px 10px 6px 0; border-top: 1px solid var(--grid); white-space: nowrap; }
  td.num, th.num { text-align: right; padding-right: 0; padding-left: 10px; }
  td.wrap, th.wrap { white-space: normal; min-width: 220px; padding-left: 16px; }
  td.wrap { color: var(--text-2); }
  td.lead, th.lead { padding-left: 16px; }   /* a left-aligned column right after a number column */
  .empty { color: var(--muted); padding: 6px 0; }
  .tag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-2); }
  #chart { position: relative; }
  #chart svg { display: block; width: 100%; height: 200px; }
  #tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
         border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap; display: none; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 12px; margin: -4px 0 8px; }
  .verdict { display: inline-flex; align-items: center; gap: 5px; }
  .verdict i { font-style: normal; font-weight: 700; }
  .verdict.ok i { color: var(--good); } .verdict.no i { color: var(--critical); } .verdict.skip i { color: var(--muted); }
  .plan p, .review p { margin: 0 0 6px; color: var(--text-2); white-space: pre-wrap; }
  .banner { border-left: 3px solid var(--warning); }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 4px 0 16px; }
  /* A ticker that opens its chart: looks like bold text with a dotted underline. */
  button.sym { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: inherit; cursor: pointer;
               text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
  button.sym:hover, button.sym:focus-visible { color: var(--series); text-decoration-color: currentColor; }
  /* Chart dialog: <dialog> gives the dark backdrop, focus trapping and Esc-to-close for free. */
  #chartDlg { width: min(1100px, calc(100vw - 32px)); max-width: none; max-height: calc(100vh - 32px); padding: 14px;
              background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 10px; }
  #chartDlg::backdrop { background: rgba(0,0,0,0.45); }
  .dlg-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 8px; }
  .dlg-head h2 { font-size: 18px; color: var(--text); margin: 0; }
  .dlg-head .chg { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text-2); }
  .ranges { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .ranges button { background: none; border: 0; padding: 4px 10px; font: inherit; font-size: 12px; color: var(--text-2); cursor: pointer; }
  .ranges button[aria-pressed="true"] { background: var(--grid); color: var(--text); font-weight: 600; }
  .dlg-head form { margin-left: auto; display: flex; gap: 6px; }
  .dlg-head input { width: 90px; font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px;
                    background: var(--page); color: var(--text); text-transform: uppercase; }
  .dlg-head .x { background: none; border: 0; font-size: 16px; color: var(--text-2); cursor: pointer; padding: 2px 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; min-height: 18px; }
  .legend b { color: var(--text); font-weight: 600; }
  .legend .sw { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
  #pchart { position: relative; height: min(60vh, 520px); margin-top: 6px; }
  #chartMsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
              color: var(--muted); font-size: 13px; pointer-events: none; z-index: 3; }
  #chartNote { margin: 8px 0 0; }
</style>
<!-- TradingView's open-source charting library (Apache-2.0), pinned to an exact version.
     Loaded from a CDN, so charts need internet access (the app needs it anyway). If it
     fails to load, the rest of the dashboard still works and the chart says why. -->
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<main>
  <header>
    <h1>OpenBell <span class="tag">PAPER</span></h1>
    <div class="status" id="status"></div>
  </header>
  <div class="card banner" id="banner" hidden></div>
  <section class="tiles" id="tiles"></section>
  <section class="card">
    <h2>Account equity</h2>
    <div id="chart"><svg id="svg" role="img" aria-label="Account equity over time"></svg><div id="tip"></div></div>
  </section>
  <section class="card"><h2>Open positions</h2><div class="scroll" id="positions"></div></section>
  <section class="card"><h2>Watchlist</h2><div class="scroll" id="watch"></div></section>
  <section class="card"><h2 id="scanTitle">Today's scan</h2><div class="sub" id="scanNote"></div><div class="scroll" id="scan"></div></section>
  <div class="two">
    <section class="card plan"><h2>Today's plan</h2><div id="plan"></div></section>
    <section class="card"><h2>Results by strategy</h2><div class="scroll" id="stats"></div></section>
  </div>
  <section class="card"><h2>Recent trades</h2><div class="scroll" id="trades"></div></section>
  <section class="card"><h2>Activity</h2><div class="scroll" id="events"></div></section>
  <section class="card review" id="reviewCard" hidden><h2 id="reviewTitle">Review</h2><div id="review"></div></section>
  <footer>Simulated fills on live prices. No real orders are sent.<span id="chartHint" hidden> Click any ticker to open its chart.</span></footer>
</main>
<dialog id="chartDlg" aria-labelledby="chartSym">
  <div class="dlg-head">
    <div><h2 id="chartSym"></h2><div class="chg" id="chartChg"></div></div>
    <div class="ranges" id="ranges" role="group" aria-label="Chart range"></div>
    <form id="chartGo"><input id="chartInput" placeholder="Symbol" aria-label="Open another symbol" autocomplete="off"></form>
    <button class="x" id="chartClose" aria-label="Close chart">✕</button>
  </div>
  <div class="legend" id="chartLegend"></div>
  <div id="pchart"><div id="chartMsg"></div></div>
  <div class="sub" id="chartNote"></div>
</dialog>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (v, d = 2) => v == null ? "–" : v.toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const signed = (v, d = 2, unit = "") => {
  if (v == null) return "–";
  const cls = v > 0 ? "up" : v < 0 ? "down" : "";
  const arrow = v > 0 ? "▲" : v < 0 ? "▼" : "";
  return `<span class="delta ${cls}"><i>${arrow}</i>${v > 0 ? "+" : v < 0 ? "−" : ""}${money(Math.abs(v), d)}${unit}</span>`;
};
let TZ = "UTC";
const clock = (iso, tz, opt) => new Date(iso).toLocaleString("en-GB", Object.assign({timeZone: tz, hour: "2-digit", minute: "2-digit"}, opt || {}));
const stamp = iso => clock(iso, "America/New_York", {day: "2-digit", month: "short"});

function table(el, cols, rows, emptyText) {
  if (!rows.length) { el.innerHTML = `<div class="empty">${emptyText}</div>`; return; }
  el.innerHTML = "<table><thead><tr>" + cols.map(c => `<th class="${c.cls || ""}">${c.h}</th>`).join("") +
    "</tr></thead><tbody>" + rows.map(r => "<tr>" + cols.map(c => `<td class="${c.cls || ""}">${c.f(r)}</td>`).join("") + "</tr>").join("") +
    "</tbody></table>";
}

function countdown(ms) {
  const m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return d ? `${d}d ${h % 24}h` : h ? `${h}h ${m % 60}m` : `${m}m`;
}

let curve = [], curveSig = "";
function drawChart() {
  const svg = $("svg"), W = svg.clientWidth || 600, H = 200, L = 8, R = 56, T = 10, B = 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (curve.length < 2) { svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--muted)" font-size="13">No equity history yet</text>`; return; }
  const ys = curve.map(p => p.equity); let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = (hi - lo || hi * 0.01) * 0.12; lo -= pad; hi += pad;
  const x = i => L + i * (W - L - R) / (curve.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  let g = "";
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * k / 3;
    g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>` +
         `<text x="${W-R+6}" y="${y(v)+4}" fill="var(--muted)" font-size="11">${money(v, 0)}</text>`;
  }
  [0, curve.length - 1].forEach((i, k) => g += `<text x="${x(i)}" y="${H-5}" text-anchor="${k ? "end" : "start"}" fill="var(--muted)" font-size="11">${stamp(curve[i].ts).split(",")[0]}</text>`);
  const d = curve.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.equity).toFixed(1)}`).join("");
  const last = curve.length - 1;
  svg.innerHTML = g + `<path d="${d}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${x(last)}" cy="${y(curve[last].equity)}" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/>` +
    `<g id="cross" style="display:none"><line id="cl" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1"/><circle id="cd" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/></g>`;
  const move = e => {
    const rect = svg.getBoundingClientRect(), px = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left);
    const i = Math.max(0, Math.min(last, Math.round((px - L) / (W - L - R) * last))), p = curve[i];
    $("cross").style.display = ""; $("cl").setAttribute("x1", x(i)); $("cl").setAttribute("x2", x(i));
    $("cd").setAttribute("cx", x(i)); $("cd").setAttribute("cy", y(p.equity));
    const tip = $("tip"); tip.style.display = "block";
    tip.innerHTML = `<b>${money(p.equity)}</b> · ${stamp(p.ts)} ET`;
    tip.style.left = Math.min(Math.max(x(i) - tip.offsetWidth / 2, 0), W - tip.offsetWidth) + "px";
  };
  const leave = () => { const c = $("cross"); if (c) c.style.display = "none"; $("tip").style.display = "none"; };
  svg.onmousemove = move; svg.ontouchstart = move; svg.ontouchmove = move; svg.onmouseleave = leave; svg.ontouchend = leave;
}

function render(s) {
  TZ = s.display_tz || "UTC";
  // Charts exist only when the server was given a chart data source (live run, sim --serve).
  LAST = s; RANGES = s.chart_ranges || []; CHARTS = RANGES.length > 0;
  $("chartHint").hidden = !CHARTS;
  const now = new Date(s.now), sess = s.session, nx = s.next_session;
  const open = sess && now >= new Date(sess.open) && now < new Date(sess.close);
  let when = "";
  if (open) when = `closes in ${countdown(new Date(sess.close) - now)}${sess.early_close ? " (half day)" : ""}`;
  else if (nx && new Date(nx.open) > now) when = `opens in ${countdown(new Date(nx.open) - now)}${nx.early_close ? " (half day)" : ""}`;
  const dot = open ? (s.feed_ok && !s.halted ? "on" : "warn") : "";
  // While trading live: which names stream in real time and which are polled (feeds.py).
  const fd = s.feeds;
  $("status").innerHTML =
    `<span class="pill"><span class="dot ${dot}"></span>${open ? "Market open" : "Market closed"}</span>` +
    `<span>${esc(s.status)}${when ? " · " + when : ""}</span>` +
    `<span>${clock(s.now, "America/New_York")} New York · ${clock(s.now, TZ)} local</span>` +
    `<span>Agent ${s.agent_active ? "on" : "off"}</span>` +
    (fd ? `<span>Data ${fd.stream.length} live · ${fd.poll.length} polled</span>` : "");
  const b = $("banner"), msgs = [];
  if (s.halted) msgs.push("Daily loss limit reached. No new entries today.");
  if (open && !s.feed_ok) msgs.push("Data feed is silent. Entries are blocked until it recovers.");
  b.hidden = !msgs.length; b.textContent = msgs.join(" ");

  const bench = (s.equity_curve || []).filter(p => p.benchmark);
  const benchRet = bench.length > 1 ? (bench[bench.length - 1].benchmark / bench[0].benchmark - 1) * 100 : null;
  const tiles = [
    ["Equity", money(s.equity), `cash ${money(s.cash, 0)}`],
    ["Day P&L", signed(s.day_pnl), signed(s.day_pnl_pct, 2, "%")],
    ["Total return", signed(s.total_pnl_pct, 2, "%"), benchRet == null ? `${esc(s.benchmark)} –` : `${esc(s.benchmark)} ${benchRet >= 0 ? "+" : "−"}${Math.abs(benchRet).toFixed(2)}% same period`],
    ["Exposure", `${money(s.exposure_pct, 1)}%`, `${s.positions.length} open · ${s.trades_today} entries today`],
  ];
  $("tiles").innerHTML = tiles.map(t => `<div class="card tile"><div class="label">${t[0]}</div><div class="value">${t[1]}</div><div class="sub">${t[2]}</div></div>`).join("");

  table($("positions"), [
    {h: "Symbol", f: r => `${sym(r.symbol)} <span class="tag">${esc(r.strategy)}</span>`},
    {h: "Qty", cls: "num", f: r => r.qty}, {h: "Entry", cls: "num", f: r => money(r.entry)},
    {h: "Last", cls: "num", f: r => money(r.last)}, {h: "Stop", cls: "num", f: r => money(r.stop)},
    {h: "Target", cls: "num", f: r => r.target ? money(r.target) : "trail"},
    {h: "P&L", cls: "num", f: r => signed(r.pnl)}, {h: "R", cls: "num", f: r => signed(r.r, 2)},
  ], s.positions, "No open positions.");

  table($("watch"), [
    {h: "Symbol", f: r => sym(r.symbol)}, {h: "Last", cls: "num", f: r => money(r.last)},
    {h: "Day", cls: "num", f: r => signed(r.chg_pct, 2, "%")}, {h: "VWAP", cls: "num", f: r => money(r.vwap)},
    {h: "Range high", cls: "num", f: r => money(r.or_high)}, {h: "Swing trigger", cls: "num", f: r => money(r.swing_trigger)},
    // "live" = websocket, every trade; otherwise polled over REST, up to poll_seconds old.
    ...(fd ? [{h: "Data", cls: "lead", f: r => fd.stream.includes(r.symbol) ? `<span class="tag">live</span>` :
      `<span class="tag" title="Not on the real-time stream: prices are fetched every ${fd.poll_seconds} s">every ${fd.poll_seconds}s</span>`}] : []),
    {h: "Agent note", cls: "wrap", f: r => esc(r.note)},
  ], s.watchlist, "No symbols.");

  const scan = s.scan || [], ss = s.scan_stats || {};
  $("scanTitle").textContent = scan.length ? `Scan · ${scan[0].day}` : "Today's scan";
  const fmt = v => v == null ? "–" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) + "%";
  $("scanNote").textContent = (ss.approve && ss.approve.n) ?
    `Next-day move so far: approved ${fmt(ss.approve.avg_1d)} (${ss.approve.n}), rejected ${fmt(ss.reject.avg_1d)} (${ss.reject.n})` :
    (scan.length ? `Selected by ${scan[0].source === "agent" ? "the agent" : "numeric rank (agent not used)"}` : "");
  const verdict = r => r.decision === "reject" ? `<span class="verdict no"><i>✕</i>Rejected</span>` :
    r.picked ? `<span class="verdict ok"><i>✓</i>Watching</span>` : `<span class="verdict skip"><i>–</i>No slot</span>`;
  table($("scan"), [
    {h: "#", f: r => r.rank}, {h: "Symbol", f: r => `${sym(r.symbol)} <span class="tag">${esc(r.kind)}</span>`},
    {h: "Result", f: verdict}, {h: "Gap", cls: "num", f: r => signed(r.metrics.gap_pct, 2, "%")},
    {h: "News", f: r => r.metrics.fresh_news ? "new" : "–"},
    {h: "Rel. volume", cls: "num", f: r => money(r.metrics.rvol) + "×"},
    {h: "3-month vs market", cls: "num", f: r => signed(r.metrics.rs_3m_pct, 1, "%")},
    {h: "Earnings", cls: "num", f: r => r.earnings_in_days == null ? "–" : `in ${r.earnings_in_days}d`},
    {h: "Reason / headline", cls: "wrap", f: r => esc(r.reason) + (r.headlines.length ? `<br><span style="color:var(--muted)">${esc(r.headlines[0])}</span>` : "")},
  ], scan, "No scan has run yet.");

  const p = s.plan || {};
  $("plan").innerHTML = `<p><b>${esc((p.regime || "").replace("_", " "))}</b> · risk ×${(p.risk_multiplier ?? 1).toFixed(2)} · source: ${esc(p.source)}</p><p>${esc(p.summary)}</p>`;

  table($("stats"), [
    {h: "Strategy", f: r => esc(r[0])}, {h: "Trades", cls: "num", f: r => r[1].trades},
    {h: "Win rate", cls: "num", f: r => r[1].trades ? r[1].win_rate + "%" : "–"},
    {h: "Avg R", cls: "num", f: r => r[1].trades ? signed(r[1].avg_r) : "–"},
    {h: "Profit factor", cls: "num", f: r => r[1].profit_factor ?? "–"},
    {h: "P&L", cls: "num", f: r => r[1].trades ? signed(r[1].pnl) : "–"},
  ], Object.entries(s.stats || {}).filter(e => e[1].trades), "No closed trades yet.");

  table($("trades"), [
    {h: "Exit (ET)", f: r => stamp(r.exit_ts)}, {h: "Symbol", f: r => `${sym(r.symbol)} <span class="tag">${esc(r.strategy)}</span>`},
    {h: "Qty", cls: "num", f: r => r.qty}, {h: "Entry", cls: "num", f: r => money(r.entry_px)},
    {h: "Exit", cls: "num", f: r => money(r.exit_px)}, {h: "P&L", cls: "num", f: r => signed(r.pnl)},
    {h: "R", cls: "num", f: r => signed(r.r_multiple)}, {h: "Reason", f: r => esc(r.exit_reason)},
  ], s.trades || [], "No closed trades yet.");

  table($("events"), [
    {h: "Time (ET)", f: r => stamp(r.ts)}, {h: "", f: r => `<span class="tag">${esc(r.kind)}</span>`},
    {h: "Symbol", f: r => sym(r.symbol)}, {h: "Detail", cls: "wrap", f: r => esc(r.message)},
  ], s.events || [], "Nothing yet.");

  $("reviewCard").hidden = !s.review;
  if (s.review) { $("reviewTitle").textContent = `Agent review · ${s.review_day}`; $("review").innerHTML = `<p>${esc(s.review)}</p>`; }
  const next = s.equity_curve || [], sig = next.length + ":" + (next.length ? next[next.length - 1].equity : 0);
  if (sig !== curveSig) { curveSig = sig; curve = next; drawChart(); }
}

// ---------------------------------------------------------------- price charts
// Clicking a ticker anywhere on the page opens a dialog with its chart: candles, volume,
// EMA 20/50, VWAP (intraday ranges), arrows for this app's paper entries and exits, and
// dotted lines for the open position's entry/stop/target, the swing trigger and today's
// opening range. Data comes from /api/chart (built by charts.py); drawing is done by
// TradingView's Lightweight Charts library, loaded in <head>.
let CHARTS = false, RANGES = [], LAST = null;     // filled in by render() from /api/state
// A ticker cell: a button that opens the chart, or plain bold text when charts are off.
const sym = s => !s ? "" : CHARTS ? `<button class="sym" data-sym="${esc(s)}" title="Open chart">${esc(s)}</button>` : `<b>${esc(s)}</b>`;
const compact = n => n == null ? "–" : n.toLocaleString("en-US", {notation: "compact", maximumFractionDigits: 1});
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// Chart state: which symbol/range is shown, a request counter (to drop late replies),
// the library objects (`view`), the last payload (`data`) and the refresh timer.
const ch = {sym: null, range: "1D", req: 0, view: null, data: null, timer: null};

// Create the chart and its series. Colours are read from the CSS tokens at build time,
// so the chart matches the light or dark theme (it is rebuilt when the theme changes).
function buildView(d) {
  const LC = window.LightweightCharts, up = css("--good"), down = css("--critical");
  const chart = LC.createChart($("pchart"), {
    autoSize: true,                                // follows the container's size
    layout: {background: {type: "solid", color: css("--surface")}, textColor: css("--muted"), fontSize: 11,
             fontFamily: 'system-ui, -apple-system, "Segoe UI", sans-serif'},
    grid: {vertLines: {color: css("--grid")}, horzLines: {color: css("--grid")}},
    rightPriceScale: {borderVisible: false}, crosshair: {mode: LC.CrosshairMode.Normal},
    // Clock times only on intraday ranges; daily candles show dates.
    timeScale: {borderVisible: false, timeVisible: d.intraday, secondsVisible: false},
  });
  const candles = chart.addCandlestickSeries({upColor: up, downColor: down, wickUpColor: up, wickDownColor: down, borderVisible: false,
    // Price lines (stop, target, ...) do not normally widen the price axis, so a stop just
    // below today's range would be invisible. Stretch the axis to include each level,
    // unless that would more than double the height (it would squash the candles);
    // such far-off levels stay off-screen until the user drags the price axis.
    autoscaleInfoProvider: original => {
      const r = original();
      if (!r || !r.priceRange || !ch.data) return r;
      let {minValue: lo, maxValue: hi} = r.priceRange;
      const span = hi - lo;
      for (const l of ch.data.levels) {
        if (l.price < lo && lo - l.price <= span) lo = l.price;
        if (l.price > hi && l.price - hi <= span) hi = l.price;
      }
      return {...r, priceRange: {minValue: lo, maxValue: hi}};
    }});
  // Price uses the top ~70% of the height; volume sits in the bottom 20% on its own
  // hidden scale ("vol"), the usual stock-chart layout. The two never share an axis.
  candles.priceScale().applyOptions({scaleMargins: {top: 0.06, bottom: 0.3}});
  const volume = chart.addHistogramSeries({priceScaleId: "vol", priceFormat: {type: "volume"}, lastValueVisible: false, priceLineVisible: false});
  chart.priceScale("vol").applyOptions({scaleMargins: {top: 0.8, bottom: 0}});
  // Indicator lines: no price label, no dot under the crosshair; the legend shows their values.
  const quiet = {lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false};
  const line = (color, dashed) => chart.addLineSeries({...quiet, color, lineWidth: 2,
    lineStyle: dashed ? LC.LineStyle.Dashed : LC.LineStyle.Solid});
  // VWAP lines (one per session) are created in drawView, which knows how many there are.
  const view = {key: d.symbol + d.range, chart, candles, volume, up, down, lines: [], vwaps: [],
    volMa: chart.addLineSeries({...quiet, priceScaleId: "vol", color: css("--muted"), lineWidth: 1}),
    emaF: line(css("--ema-fast")), emaS: line(css("--ema-slow")), addVwap: () => line(css("--vwap"), true)};
  // The legend follows the crosshair; off the chart it shows the latest candle.
  chart.subscribeCrosshairMove(p => showLegend(p.time ? p.seriesData : null));
  return view;
}

function dropView() { if (ch.view) { ch.view.chart.remove(); ch.view = null; } }

// Put a payload on screen. A new symbol or range builds a fresh chart and fits it to
// the data; a periodic refresh of the same one updates in place, keeping the user's zoom.
function drawView(d) {
  const fresh = !ch.view || ch.view.key !== d.symbol + d.range;
  if (fresh) { dropView(); ch.view = buildView(d); }
  ch.data = d;
  const v = ch.view, LC = window.LightweightCharts;
  v.candles.setData(d.candles.map(c => ({time: c.time, open: c.open, high: c.high, low: c.low, close: c.close})));
  // Volume bars take the candle's direction colour at 35% opacity ("59" hex alpha).
  v.volume.setData(d.candles.map(c => ({time: c.time, value: c.volume, color: (c.close >= c.open ? v.up : v.down) + "59"})));
  v.volMa.setData(d.volume_ma); v.emaF.setData(d.ema_fast); v.emaS.setData(d.ema_slow);
  // VWAP restarts every session, so each session is its own line; a single series would
  // join one day's last value to the next day's first.
  v.vwaps.forEach(s => v.chart.removeSeries(s));
  v.vwaps = d.vwap.map(pts => { const s = v.addVwap(); s.setData(pts); return s; });
  // Entries: up arrow under the candle; exits: down arrow above it, labelled with the R result.
  v.candles.setMarkers(d.markers.map(m => m.side === "buy"
    ? {time: m.time, position: "belowBar", shape: "arrowUp", color: v.up, text: m.text}
    : {time: m.time, position: "aboveBar", shape: "arrowDown", color: v.down, text: m.text}));
  // Price levels are replaced on every draw because stops move and positions close.
  v.lines.forEach(l => v.candles.removePriceLine(l));
  const tone = {entry: css("--text-2"), stop: v.down, target: v.up, trigger: css("--series"), range: css("--muted")};
  v.lines = d.levels.map(l => v.candles.createPriceLine({price: l.price, color: tone[l.kind], lineWidth: 1,
    lineStyle: LC.LineStyle.Dotted, axisLabelVisible: true, title: l.label}));
  if (fresh) v.chart.timeScale().fitContent();

  // Header: last price and the change over the range (vs the close before it).
  const n = d.candles.length, last = n ? d.candles[n - 1].close : null;
  $("chartChg").innerHTML = last == null || d.base == null ? "" :
    `<b>${money(last)}</b> ${signed(last - d.base)} (${signed((last / d.base - 1) * 100, 2, "%")}) · ${esc(d.range)}`;
  $("chartMsg").textContent = n ? "" : "No bars for this symbol in this range.";
  showLegend(null);

  // Footnote: where the data comes from, plus what the scan said about this symbol.
  const src = d.feed === "synthetic" ? "Simulated prices" : d.feed === "sip" ? "Full-market (SIP) prices" :
    `${String(d.feed).toUpperCase()} prices (one exchange only, so volume is partial)`;
  const bars = d.intraday ? `${d.bar_minutes}-minute candles, New York time` : "daily candles";
  const scan = ((LAST && LAST.scan) || []).find(r => r.symbol === d.symbol);
  $("chartNote").textContent = `${src}${d.delay_minutes ? `, ${d.delay_minutes} min delayed` : ""} · ${bars}. ` +
    "Arrows: paper entries and exits. Dotted lines: position and setup levels." +
    (scan ? ` Scan ${scan.day}: #${scan.rank} ${scan.kind}, ${scan.decision === "reject" ? "rejected" : scan.picked ? "watching" : "no slot"}` +
            (scan.reason ? ` (${scan.reason})` : "") + "." : "");
}

// Legend line: OHLC + volume + indicator values at the crosshair (`sd` = the library's
// map of series -> value at that time), or for the latest candle when `sd` is null.
function showLegend(sd) {
  const d = ch.data, v = ch.view, n = d ? d.candles.length : 0;
  if (!n || !v) { $("chartLegend").innerHTML = ""; return; }
  const c = sd ? sd.get(v.candles) : d.candles[n - 1];
  if (!c) return;                                  // crosshair over empty space
  const at = (series, pts) => sd ? (sd.get(series) || {}).value : (pts.length ? pts[pts.length - 1].value : null);
  const vol = sd ? (sd.get(v.volume) || {}).value : d.candles[n - 1].volume;
  // VWAP: under the crosshair, whichever session's line has a point there; otherwise
  // the last point of the latest session.
  const lastDay = d.vwap.length ? d.vwap[d.vwap.length - 1] : [];
  const vwap = sd ? v.vwaps.map(s => (sd.get(s) || {}).value).find(x => x != null)
                  : (lastDay.length ? lastDay[lastDay.length - 1].value : null);
  // Each indicator gets a line swatch AND its name, so identity never rests on colour.
  const item = (color, name, val, dashed) => val == null ? "" :
    `<span><span class="sw" style="border-color:${color}${dashed ? ";border-top-style:dashed" : ""}"></span>${name} <b>${money(val)}</b></span>`;
  $("chartLegend").innerHTML =
    `<span>O <b>${money(c.open)}</b> H <b>${money(c.high)}</b> L <b>${money(c.low)}</b> C <b>${money(c.close)}</b></span>` +
    `<span>Vol <b>${compact(vol)}</b></span>` +
    item(css("--ema-fast"), `EMA ${d.ema_periods[0]}`, at(v.emaF, d.ema_fast)) +
    item(css("--ema-slow"), `EMA ${d.ema_periods[1]}`, at(v.emaS, d.ema_slow)) +
    (d.intraday ? item(css("--vwap"), "VWAP", vwap, true) : "");
}

// Fetch and draw the current symbol/range. `my` numbers the request: if the user has
// switched symbol or range while it was in flight, the late reply is ignored.
async function loadChart() {
  const my = ++ch.req;
  if (!ch.view) $("chartMsg").textContent = "Loading…";
  try {
    const res = await fetch(`api/chart/${encodeURIComponent(ch.sym)}?range=${ch.range}`);
    const body = await res.json();
    if (my !== ch.req) return;
    if (!res.ok) throw new Error(body.detail || res.statusText);
    if (!window.LightweightCharts) throw new Error("The chart library did not load. Charts need internet access.");
    drawView(body);
  } catch (e) {
    if (my !== ch.req) return;
    // A failed refresh keeps the chart already on screen; a failed first load explains itself.
    if (ch.view) $("chartNote").textContent = `Refresh failed: ${e.message}`;
    else { $("chartMsg").textContent = e.message; $("chartLegend").innerHTML = ""; }
  }
}

function renderRanges() {
  $("ranges").innerHTML = RANGES.map(r => `<button type="button" data-range="${r}" aria-pressed="${r === ch.range}">${r}</button>`).join("");
}

function openChart(s) {
  ch.sym = s.trim().toUpperCase(); ch.data = null; dropView();
  $("chartSym").textContent = ch.sym;
  ["chartChg", "chartLegend", "chartNote"].forEach(id => $(id).innerHTML = "");
  renderRanges();
  if (!$("chartDlg").open) $("chartDlg").showModal();
  loadChart();
  // Refresh every minute while open (the server caches intraday data for 60 s).
  clearInterval(ch.timer); ch.timer = setInterval(loadChart, 60000);
}

// One listener for every ticker button: the tables are re-rendered every 3 s, so
// per-button handlers would have to be re-attached each time.
document.addEventListener("click", e => { const b = e.target.closest("button.sym"); if (b) openChart(b.dataset.sym); });
$("ranges").onclick = e => {
  const b = e.target.closest("button");
  if (b && b.dataset.range !== ch.range) { ch.range = b.dataset.range; renderRanges(); dropView(); loadChart(); }
};
$("chartGo").onsubmit = e => { e.preventDefault(); const v = $("chartInput").value.trim(); if (v) { $("chartInput").value = ""; openChart(v); } };
$("chartClose").onclick = () => $("chartDlg").close();
// Closing (✕ or Esc) stops the refresh, cancels any request in flight and frees the chart.
$("chartDlg").addEventListener("close", () => { clearInterval(ch.timer); ch.req++; dropView(); });
// Theme switched while open: rebuild with the other theme's colours.
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (ch.view && ch.data) { dropView(); drawView(ch.data); } });

async function tick() {
  try {
    render(await (await fetch("api/state")).json());
    // A link like http://127.0.0.1:8000/#chart=NVDA (optionally &range=6M) opens that
    // chart once the page has loaded, so a chart can be bookmarked. Read once, then
    // cleared so later refreshes do not reopen it.
    const m = location.hash.match(/^#chart=([A-Za-z0-9.\-]+)(?:&range=(\w+))?$/);
    if (m && CHARTS) {
      history.replaceState(null, "", location.pathname);
      if (RANGES.includes(m[2])) ch.range = m[2];
      openChart(m[1]);
    }
  }
  catch (e) { $("status").innerHTML = `<span class="pill"><span class="dot off"></span>Engine not reachable</span>`; }
}
tick(); setInterval(tick, 3000); addEventListener("resize", drawChart);
</script>
</body>
</html>
